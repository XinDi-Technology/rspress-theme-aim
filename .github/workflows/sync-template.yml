name: Sync to Template Repository

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone template repository
        env:
          TEMPLATE_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TEMPLATE_TOKEN}@github.com/XinDi-Technology/rspress-theme-aim-template.git template-repo

      - name: Sync core files
        run: |
          cd template-repo
          
          # Sync theme directory
          rm -rf theme
          cp -r ../theme .
          
          # Sync config files
          cp ../rspress.config.ts .
          cp ../i18n.json .
          cp ../tsconfig.json .
          cp ../package.json .
          cp ../pnpm-lock.yaml .
          cp ../.editorconfig .
          cp ../.eslintrc.js .
          cp ../.prettierrc .
          cp ../.gitignore .
          cp ../LICENSE .
          
          # Sync docs structure (without example content)
          mkdir -p docs/zh/guide docs/zh/blog docs/en/guide docs/en/blog docs/public
          
          # Sync guide docs
          cp -r ../docs/zh/guide/* docs/zh/guide/ 2>/dev/null || true
          cp -r ../docs/en/guide/* docs/en/guide/ 2>/dev/null || true
          
          # Sync public assets
          cp -r ../docs/public/* docs/public/ 2>/dev/null || true
          
          # Sync navigation
          cp ../docs/zh/_nav.json docs/zh/
          cp ../docs/en/_nav.json docs/en/
          
          # Sync home pages
          cp ../docs/zh/index.md docs/zh/
          cp ../docs/en/index.md docs/en/
          
          # Create empty blog index files
          cat > docs/zh/blog/index.mdx << 'EOF'
          ---
          title: 博客
          ---
          
          import { Blog } from '../../theme/components/Blog';
          
          <Blog />
          EOF
          
          cat > docs/en/blog/index.mdx << 'EOF'
          ---
          title: Blog
          ---
          
          import { Blog } from '../../theme/components/Blog';
          
          <Blog />
          EOF
          
          # Sync workflows
          mkdir -p .github/workflows
          cp ../.github/workflows/deploy.yml .github/workflows/

      - name: Update README for template
        run: |
          cd template-repo
          cat > README.md << 'EOF'
          # Rspress Theme AIm Template
          
          > A lightweight template for Rspress documentation sites.
          
          ## 🚀 Quick Start
          
          ### 1. Use this template
          
          Click "Use this template" to create your repository.
          
          ### 2. Update configuration
          
          Update `rspress.config.ts`:
          ```typescript
          base: '/your-repo-name/',
          title: 'Your Project Title',
          ```
          
          ### 3. Enable GitHub Pages
          
          Settings → Pages → Source: GitHub Actions
          
          ### 4. Deploy
          
          Push your changes and wait for the deployment.
          
          ## 📚 Documentation
          
          - [Theme Documentation](https://xindi-technology.github.io/rspress-theme-aim/)
          - [Rspress Documentation](https://rspress.rs/)
          
          ## 📄 License
          
          MIT License
          EOF

      - name: Commit and push changes
        run: |
          cd template-repo
          git add -A
          git commit -m "sync: update from rspress-theme-aim@${{ github.event.release.tag_name || 'latest' }}" || echo "No changes to commit"
          git push origin main
